[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediapipeline"
version = "0.0.0"
description = "MediaPipelineRemuxEncodeAIO backend, desktop API, pipeline helpers, and tooling."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "tests/python",
    "tests/webview",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [
    "docs/archive",
    "apps/desktop/tauri/node_modules",
    "apps/desktop/tauri/src-tauri/target",
    "apps/desktop/tauri/src-tauri/gen",
    "ops/pipeline/runtime",
    "ops/pipeline/tools",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "Runtime",
]

[tool.ruff.lint]
select = [
    "F",
    "E9",
    "W6",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/test_*.py" = ["F401"]
"**/conftest.py" = ["F401", "F403"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
exclude = '''(?x)(
    ^apps/desktop/runtime/
    | ^ops/pipeline/runtime/
    | ^ops/pipeline/tools/
    | ^docs/archive/
    | ^docs/generated/summaries/
  )'''

[[tool.mypy.overrides]]
module = ["pydantic.*"]
ignore_missing_imports = true
