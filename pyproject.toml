[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediapipeline"
version = "2026.6.4+001"
description = "MediaPipelineRemuxEncodeAIO backend, desktop API, pipeline helpers, and tooling."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "psutil>=5.9,<8",
    "pysubs2>=1.7,<2",
    "zeroconf>=0.132,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "tests/python",
    "tests/webview",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [
    "docs/archive",
    "apps/desktop/tauri/node_modules",
    "apps/desktop/tauri/src-tauri/target",
    "apps/desktop/tauri/src-tauri/gen",
    "ops/pipeline/runtime",
    "ops/pipeline/tools",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "Runtime",
]

[tool.ruff.lint]
select = [
    "F",
    "B",
    "E9",
    "W6",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/test_*.py" = ["F401"]
"**/conftest.py" = ["F401", "F403"]
# These module families are compatibility splits: their locally annotated
# star imports intentionally re-export names across sibling slices. Keep the
# existing wiring visible while still enforcing every other Ruff rule.
"src/mediapipeline/contracts/api_routes_command.py" = ["F401", "F405"]
"src/mediapipeline/contracts/config*.py" = ["F401", "F405"]
"src/mediapipeline/core/completed/policy*.py" = ["F401", "F405"]
"src/mediapipeline/core/config/settings_wizard*.py" = ["F401", "F405"]
"src/mediapipeline/core/diagnostics/autonomy_health*.py" = ["F401", "F405"]
"src/mediapipeline/core/diagnostics/tdarr_matrix_audit*.py" = ["F401", "F405"]
"src/mediapipeline/core/failures/policy*.py" = ["F401", "F405"]
"src/mediapipeline/core/library/route_map*.py" = ["F401", "F405"]
"src/mediapipeline/core/network/facade*.py" = ["F401", "F405"]
"src/mediapipeline/core/network/registry*.py" = ["F401", "F405"]
"src/mediapipeline/core/processes/preflight*.py" = ["F401", "F405"]
"src/mediapipeline/core/processes/rerun_preview*.py" = ["F401", "F405"]
"src/mediapipeline/core/processes/rerun_results*.py" = ["F401", "F405"]
"src/mediapipeline/core/repair_reconcile/dry_run*.py" = ["F401", "F405"]
"src/mediapipeline/core/sample_validation/pilot_plan*.py" = ["F401", "F405"]
"src/mediapipeline/desktop/api/contract_command.py" = ["F401", "F405"]
"src/mediapipeline/desktop/network/registry*.py" = ["F401", "F405"]
"src/mediapipeline/tools/dev/tdarr_matrix*.py" = ["F401", "F405"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
exclude = '''(?x)(
    ^apps/desktop/runtime/
    | ^ops/pipeline/runtime/
    | ^ops/pipeline/tools/
    | ^docs/archive/
    | ^docs/generated/summaries/
  )'''

[[tool.mypy.overrides]]
module = ["pydantic.*"]
ignore_missing_imports = true
