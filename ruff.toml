# MediaPipelineRemuxEncodeAIO V5 — Python lint configuration
#
# Per Docs/proposals/CODE_MANAGEMENT_CLEANUP_PLAN.md §3.8.
#
# This is a WARN-ONLY gate. It catches real bugs (unused imports, undefined
# names, dead variables) without reformatting code or enforcing stylistic
# preferences. It is NOT a hard CI gate yet — contributors run `ruff check`
# locally and fix in the chunks they touch. As violations approach zero in
# any directory, the lint can be promoted to a hard gate for that directory.
#
# Explicitly NOT enabled (per §5.1 — no mass autoformat):
#   - ruff format (formatter)
#   - I (isort) — would reorder imports across the codebase in one diff
#   - D (pydocstyle) — too noisy; docstrings are added per-chunk
#   - ANN (annotations) — type hints added per workstream §3.5, not all at once
#   - PT (pytest style), N (naming), etc. — opinionated style, defer
#
# To run locally:
#
#   pip install ruff
#   ruff check .
#
# To check a single file or directory:
#
#   ruff check DesktopApp/mediapipeline_desktop_app/api/
#   ruff check path/to/file.py
#
# To add a new rule family later (e.g., once codebase passes `F` cleanly):
#
#   1. Run `ruff check --select B .` to preview what would be flagged.
#   2. Decide: enable codebase-wide, per-directory, or skip.
#   3. Land the addition as a separate chunk.

line-length = 140
target-version = "py311"

# Directories that are excluded from lint entirely.
extend-exclude = [
    "Docs/archive",
    "DesktopApp/tauri_shell/node_modules",
    "DesktopApp/tauri_shell/src-tauri/target",
    "**/.pytest_cache",
    "**/build",
    "**/dist",
    "**/__pycache__",
    "MKVToolNix",
    "ffmpeg",
    "Runtime",
]

[lint]
# Start with the narrowest, highest-signal rule families:
#   F   — Pyflakes (undefined names, unused imports, dead variables)
#   E9  — pycodestyle runtime errors (syntax errors, indentation that breaks code)
#   W6  — pycodestyle deprecation warnings (real Python deprecations only)
#
# These catch real bugs. They do NOT enforce style (no max-line-length
# bikeshedding, no whitespace nits).
select = [
    "F",   # Pyflakes — unused imports, undefined names, redefinitions, dead vars
    "E9",  # pycodestyle — syntax/indentation errors that break Python
    "W6",  # pycodestyle — Python deprecation warnings
]

# Rules to ignore even within the selected families:
ignore = [
    # F401 unused imports inside __init__.py files are typically deliberate
    # re-exports (per the §4.5.2 namespace pattern).  Treat as documentation.
    # We allow but flag elsewhere — see per-file-ignores below.
]

[lint.per-file-ignores]
# __init__.py re-export shims intentionally import names without using them.
"**/__init__.py" = ["F401", "F403"]
# Test files often import fixtures they don't directly reference.
"**/test_*.py" = ["F401"]
"**/conftest.py" = ["F401", "F403"]

[lint.flake8-quotes]
# Don't enforce a quote style — codebase uses both " and ' freely.
inline-quotes = "double"
multiline-quotes = "double"

# To preview what a broader rule set would catch (without committing):
#
#   ruff check --select F,B,SIM,UP .
#
# Discussion log for rule-family decisions belongs in
# Docs/proposals/CODE_MANAGEMENT_CLEANUP_PLAN.md §3.8 follow-up chunks.
