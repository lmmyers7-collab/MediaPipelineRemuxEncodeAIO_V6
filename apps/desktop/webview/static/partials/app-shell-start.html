  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">MediaPipeline</div>
        <div id="app-version" class="brand-version">2026.06.04.001</div>
      </div>
      <nav class="nav">
        <button type="button" class="nav-button is-active" data-page="home" aria-current="page">Home</button>
        <button type="button" class="nav-button" data-page="launch">Launch</button>
        <button type="button" class="nav-button" data-page="live">Telemetry</button>
        <button type="button" class="nav-button" data-page="metrics">Metrics</button>
        <button type="button" class="nav-button" data-page="queue">Queue</button>
        <button type="button" class="nav-button" data-page="completed">Completed Output</button>
        <button type="button" class="nav-button" data-page="pending">Pending Publish</button>
        <button type="button" class="nav-button" data-page="rename">Rename</button>
        <button type="button" class="nav-button" data-page="reports">Reports</button>
        <button type="button" class="nav-button" data-page="network">Network Workers</button>
        <button type="button" class="nav-button" data-page="libraries">Libraries</button>
        <button type="button" class="nav-button" data-page="schedule">Schedule</button>
        <button type="button" class="nav-button" data-page="settings">Settings</button>
        <button type="button" class="nav-button" data-page="diagnostics">Diagnostics</button>
        <button type="button" class="nav-button" data-page="maintenance">Maintenance</button>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-status">
          <div id="state-pill" class="state-pill">Connecting</div>
          <p class="activity-display" id="activity">
            <span class="activity-primary">Waiting for backend...</span>
            <span class="activity-meta"></span>
          </p>
        </div>
        <div class="topbar-actions">
          <button type="button" id="refresh-health" class="refresh-health" data-state="unknown" title="Open Diagnostics" aria-label="Open Diagnostics for refresh health">Refresh: starting</button>
          <button type="button" id="close-readiness" class="close-readiness" data-state="unknown" title="Open Diagnostics" aria-label="Open Diagnostics for close readiness">Close: checking</button>
          <div id="pipeline-sparkline" class="pipeline-sparkline" aria-hidden="true"></div>
          <button type="button" id="advanced-toggle" class="secondary-button" aria-pressed="false">Advanced</button>
          <button type="button" id="evidence-toggle" class="secondary-button" aria-pressed="false">Hide Evidence</button>
          <button type="button" id="customize-layout-btn" class="secondary-button" aria-pressed="false" title="Open the Layout Editor drawer">Customize</button>
          <button type="button" id="reset-layout-btn" class="secondary-button layout-reset-visible-btn" title="Reset layout preferences for the current page while the Layout Editor is open">Reset Layout</button>
          <button type="button" id="pipeline-log-window-button" class="secondary-button" title="Toggle the floating Pipeline Log" aria-label="Toggle floating Pipeline Log" aria-pressed="false">Log</button>
          <button type="button" id="refresh-button" class="secondary-button">Refresh</button>
          <button type="button" class="danger-button emergency-button topbar-emergency-control" data-control-action="kill" data-confirm-command="true" hidden aria-label="Emergency force stop related pipeline, audit, and CSV rerun processes">Force Stop</button>
        </div>
      </header>

      <section id="floating-pipeline-log-panel" class="floating-pipeline-log" aria-labelledby="floating-pipeline-log-title" aria-hidden="true" hidden>
        <header class="floating-pipeline-log-header">
          <div class="floating-pipeline-log-heading">
            <span class="floating-pipeline-log-eyebrow">Read-only diagnostics</span>
            <h2 id="floating-pipeline-log-title">Pipeline Log</h2>
          </div>
          <strong id="floating-pipeline-log-status" class="floating-pipeline-log-status" data-state="empty">Closed</strong>
        </header>
        <div class="floating-pipeline-log-controls">
          <label class="check-row floating-pipeline-log-follow-row">
            <input id="floating-pipeline-log-follow" type="checkbox" checked>
            Follow tail
          </label>
          <label class="floating-pipeline-log-mode-row">
            Mode
            <select id="floating-pipeline-log-mode" aria-label="Pipeline Log display mode">
              <option value="activity" selected>Activity</option>
              <option value="raw">Raw tail</option>
            </select>
          </label>
          <button type="button" id="floating-pipeline-log-refresh-button" class="secondary-button">Refresh</button>
          <button type="button" id="floating-pipeline-log-close-button" class="secondary-button">Close</button>
          <span id="floating-pipeline-log-updated" class="floating-pipeline-log-updated">Not refreshed yet</span>
        </div>
        <pre id="floating-pipeline-log-text" class="log-block floating-pipeline-log-text">Open Log to load pipeline log.</pre>
      </section>

      <aside id="layout-editor-drawer" class="layout-editor-drawer" aria-hidden="true" aria-label="Layout Editor" hidden inert>
        <div class="layout-editor-header">
          <div>
            <h2>Layout Editor</h2>
            <p id="layout-editor-page-label" class="layout-editor-page-label">Page: Home</p>
          </div>
          <button type="button" id="layout-editor-done" class="secondary-button">Done</button>
        </div>
        <div id="layout-editor-tree" class="layout-editor-tree" role="tree" aria-label="Current page layout groups"></div>
        <p id="layout-editor-status" class="layout-editor-status" role="status">Choose a panel to preview or adjust its layout.</p>
        <div class="layout-editor-footer">
          <button type="button" id="layout-editor-reset-subtab" class="secondary-button">Reset Current Subtab</button>
          <button type="button" id="layout-editor-reset-page" class="secondary-button">Reset Current Page</button>
          <button type="button" id="layout-editor-reset-all" class="danger-button">Reset All Layouts</button>
        </div>
      </aside>
