[package]
name = "mediapipeline-tauri-shell"
version = "2026.6.4+001"
description = "MediaPipelineRemuxEncodeAIO Tauri/WebView2 shell"
authors = ["MediaPipeline"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mediapipeline_tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
