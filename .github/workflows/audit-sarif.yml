name: Audit SARIF

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "refactor/**"
    paths:
      - ".github/workflows/audit-sarif.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ruff:
    name: Ruff SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.15.20,<1"

      - name: Run Ruff
        continue-on-error: true
        run: ruff check --output-format=sarif --output-file=ruff.sarif .

      - name: Summarize Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("ruff.sarif").read_text(encoding="utf-8"))
          count = sum(len(run.get("results", [])) for run in data.get("runs", []))
          print("### Ruff SARIF")
          print(f"Findings: {count}")
          PY

      - name: Upload Ruff SARIF artifact
        if: always() && hashFiles('ruff.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-sarif
          path: ruff.sarif
          if-no-files-found: error

      - name: Upload Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: ruff.sarif
          category: ruff

  semgrep:
    name: Semgrep SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install "semgrep>=1,<2"

      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config p/default --sarif --output semgrep.sarif .

      - name: Summarize Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("semgrep.sarif").read_text(encoding="utf-8"))
          count = sum(len(run.get("results", [])) for run in data.get("runs", []))
          print("### Semgrep SARIF")
          print(f"Findings: {count}")
          PY

      - name: Upload Semgrep SARIF artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
