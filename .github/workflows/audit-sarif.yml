name: Audit SARIF

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ruff:
    name: Ruff SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"

      - name: Run Ruff
        continue-on-error: true
        run: ruff check --output-format=sarif --output-file=ruff.sarif .

      - name: Upload Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff.sarif
          category: ruff

  semgrep:
    name: Semgrep SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install "semgrep>=1,<2"

      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config p/default --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
