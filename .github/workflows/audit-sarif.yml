name: Audit SARIF

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "refactor/**"
    paths:
      - ".github/workflows/audit-sarif.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  RUFF_VERSION: "0.16.1"
  SEMGREP_VERSION: "1.172.0"
  SEMGREP_RULESET_SOURCE: "https://semgrep.dev/c/p/default"
  SEMGREP_RULESET_SHA256: "a7eb740a484688c0ba24668bb5fb7fc9a8ebc04c8eae982230d75f2ad9094bbc"

jobs:
  ruff:
    name: Ruff SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: Run Ruff
        continue-on-error: true
        run: ruff check --output-format=sarif --output-file=ruff.sarif .

      - name: Stamp Ruff SARIF provenance
        if: always() && hashFiles('ruff.sarif') != ''
        run: >-
          python ops/scripts/dev/run-python-tool.py
          mediapipeline.tools.dev.audit_sarif_provenance stamp-sarif
          --sarif ruff.sarif
          --scanner ruff
          --expected-version "${RUFF_VERSION}"

      - name: Summarize Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("ruff.sarif").read_text(encoding="utf-8"))
          count = sum(len(run.get("results", [])) for run in data.get("runs", []))
          provenance = data["runs"][0]["properties"]["mediaPipelineAuditProvenance"]
          print("### Ruff SARIF")
          print(f"Scanner: `{provenance['scanner']} {provenance['scanner_version']}`")
          print(f"Findings: {count}")
          PY

      - name: Upload Ruff SARIF artifact
        if: always() && hashFiles('ruff.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-sarif
          path: ruff.sarif
          if-no-files-found: error

      - name: Upload Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: ruff.sarif
          category: ruff

  semgrep:
    name: Semgrep SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"

      - name: Fetch pinned Semgrep ruleset
        run: >-
          python ops/scripts/dev/run-python-tool.py
          mediapipeline.tools.dev.audit_sarif_provenance fetch-ruleset
          --source "${SEMGREP_RULESET_SOURCE}"
          --sha256 "${SEMGREP_RULESET_SHA256}"
          --output "${RUNNER_TEMP}/semgrep-p-default.yml"

      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config "${RUNNER_TEMP}/semgrep-p-default.yml" --sarif --output semgrep.sarif .

      - name: Stamp Semgrep SARIF provenance
        if: always() && hashFiles('semgrep.sarif') != ''
        run: >-
          python ops/scripts/dev/run-python-tool.py
          mediapipeline.tools.dev.audit_sarif_provenance stamp-sarif
          --sarif semgrep.sarif
          --scanner semgrep
          --expected-version "${SEMGREP_VERSION}"
          --ruleset-source "${SEMGREP_RULESET_SOURCE}"
          --ruleset-sha256 "${SEMGREP_RULESET_SHA256}"

      - name: Summarize Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("semgrep.sarif").read_text(encoding="utf-8"))
          count = sum(len(run.get("results", [])) for run in data.get("runs", []))
          provenance = data["runs"][0]["properties"]["mediaPipelineAuditProvenance"]
          print("### Semgrep SARIF")
          print(f"Scanner: `{provenance['scanner']} {provenance['scanner_version']}`")
          print(f"Ruleset source: `{provenance['ruleset_source']}`")
          print(f"Ruleset SHA-256: `{provenance['ruleset_sha256']}`")
          print(f"Findings: {count}")
          PY

      - name: Upload Semgrep SARIF artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
