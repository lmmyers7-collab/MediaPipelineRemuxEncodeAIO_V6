name: Generated Drift Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  generated-context:
    name: Generated context drift
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contract dependencies
        run: python -m pip install -r requirements/dev.txt -e .

      - name: Check summary freshness
        run: python -m mediapipeline.tools.dev.refresh_summaries --check

      - name: Check project index and dependency graph
        run: python -m mediapipeline.tools.dev.generate_project_index --check

      - name: Check pipeline map
        run: python -m mediapipeline.tools.dev.generate_pipeline_map --check

      - name: Check lifecycle map
        run: python -m mediapipeline.tools.dev.generate_lifecycle_map --check

      - name: Check config schema
        run: python -m mediapipeline.tools.dev.generate_config_schema --check

      - name: Check stage schema
        run: python -m mediapipeline.tools.dev.generate_stage_schema --check

      - name: Check risky file registry
        run: python -m mediapipeline.tools.dev.check_risky_file_registry

      - name: Check architecture guardrails
        run: python -m mediapipeline.tools.dev.check_architecture_guardrails

      - name: Check naming lint
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            python -m mediapipeline.tools.lint_naming --git-diff "origin/${{ github.base_ref }}"
          } else {
            python -m mediapipeline.tools.lint_naming
          }

      - name: Check active doc references
        run: python -m mediapipeline.tools.dev.check_active_doc_references

      - name: Check change packet coverage
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            python -m mediapipeline.tools.change_control.validate_changes --require-diff-coverage "origin/${{ github.base_ref }}"
          } else {
            python -m mediapipeline.tools.change_control.validate_changes
          }

      - name: Check Python typing
        run: python -m mediapipeline.tools.dev.check_python_typing

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Check engine PowerShell analysis
        shell: pwsh
        run: .\ops\scripts\dev\check_powershell_analysis.ps1

  python-tests:
    name: Python unit tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt -e .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -q

  webview-prework:
    name: WebView prework
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install WebView tooling
        run: npm ci

      - name: Run WebView prework checks
        run: npm run webview:prework:check

  tauri-check:
    name: Tauri shell check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Install Tauri tooling
        run: npm ci
        working-directory: apps/desktop/tauri

      - name: Check Tauri shell
        run: npm run check
        working-directory: apps/desktop/tauri

  release-self-test:
    name: Release self-test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements/dev.txt -e .
          npm ci
          npm ci --prefix apps/desktop/tauri

      - name: Run release self-test with required gates
        shell: pwsh
        run: .\ops\scripts\release\test.ps1 -RequireTests

  package-verify:
    name: Package verify
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements/dev.txt -e .
          npm ci
          npm ci --prefix apps/desktop/tauri

      - name: Build and verify release package
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'MediaPipelineRemuxEncodeAIO_CI_Portable'
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          .\ops\scripts\release\build.ps1 -DestinationRoot $destination -Zip -Verify -IncludeTests
