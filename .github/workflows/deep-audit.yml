name: Deep Audit

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "refactor/**"
    paths:
      - ".github/workflows/deep-audit.yml"
  schedule:
    - cron: "43 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-context:
    name: Generated context and guardrails
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt -e .

      - name: Check AI guardrail plan
        run: python -m mediapipeline.tools.dev.ai_guardrail preflight --no-run

      - name: Run deep audit Python check suite, including lint
        run: python -m mediapipeline.tools.dev.audit_checks run deep-audit

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Check engine PowerShell analysis
        shell: pwsh
        run: .\ops\scripts\dev\check_powershell_analysis.ps1

  python-tests:
    name: Python unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt -e .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -q

  webview-prework:
    name: WebView prework
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install WebView tooling
        run: npm ci

      - name: Run WebView prework checks
        run: npm run webview:prework:check

  tauri-check:
    name: Tauri shell check
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Install Tauri tooling
        run: npm ci
        working-directory: apps/desktop/tauri

      - name: Check Tauri shell
        run: npm run check
        working-directory: apps/desktop/tauri

  release-self-test:
    name: Release self-test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Provision CI Python runtime
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiPythonRuntime.ps1 -InstallDependencies

      - name: Provision CI media tools
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiMediaTools.ps1 -InstallMissing

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements/dev.txt -e .
          npm ci
          npm ci --prefix apps/desktop/tauri

      - name: Run release self-test with required gates
        shell: pwsh
        run: .\ops\scripts\release\test.ps1 -RequireTests

  package-verify:
    name: Package verify
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Provision CI Python runtime
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiPythonRuntime.ps1 -InstallDependencies

      - name: Provision CI media tools
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiMediaTools.ps1 -InstallMissing

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements/dev.txt -e .
          npm ci
          npm ci --prefix apps/desktop/tauri

      - name: Build and verify release package
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'MediaPipelineRemuxEncodeAIO_CI_Portable'
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          .\ops\scripts\release\build.ps1 -DestinationRoot $destination -Zip -Verify -IncludeTests
