name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"
  schedule:
    - cron: "32 8 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: ${{ vars.CODEQL_UPLOAD_MODE || 'never' }}

      - name: Summarize CodeQL SARIF
        if: always() && hashFiles('codeql-results/*.sarif') != ''
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_UPLOAD_MODE: ${{ vars.CODEQL_UPLOAD_MODE || 'never' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          sarif_files = sorted(Path("codeql-results").glob("*.sarif"))
          count = 0
          for sarif_path in sarif_files:
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              count += sum(len(run.get("results", [])) for run in data.get("runs", []))

          print(f"### CodeQL {Path(os.environ.get('CODEQL_LANGUAGE', 'unknown')).name}")
          print(f"SARIF files: {len(sarif_files)}")
          print(f"Findings: {count}")
          print(f"Code Scanning upload mode: {os.environ.get('CODEQL_UPLOAD_MODE', 'never')}")
          PY

      - name: Upload CodeQL SARIF artifact
        if: always() && hashFiles('codeql-results/*.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
