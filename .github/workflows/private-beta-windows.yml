name: Private Beta Windows Installer

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Updater channel to publish"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
      version:
        description: "SemVer package version for Tauri/Cargo/npm/Python metadata"
        required: true
        default: "2026.6.4+001"
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "app-v2026.6.4+001"
      publish_release:
        description: "Create/upload GitHub Release assets"
        required: true
        default: false
        type: boolean
      allow_same_commit_rebuild:
        description: "Request protected replacement of assets on the same commit"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: private-beta-windows-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  validate-windows:
    name: Validate unsigned release inputs
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      MEDIAPIPELINE_RELEASE_CHANNEL: ${{ inputs.channel }}
      MEDIAPIPELINE_RELEASE_REPOSITORY: ${{ github.repository }}
      MEDIAPIPELINE_RELEASE_TAG: ${{ inputs.release_tag }}
      MEDIAPIPELINE_SEMVER_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Validate workflow inputs
        shell: pwsh
        run: |
          if ($env:MEDIAPIPELINE_RELEASE_CHANNEL -notin @('beta', 'stable')) { throw 'Unsupported release channel.' }
          if ($env:MEDIAPIPELINE_RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Unsafe repository value.' }
          if ($env:MEDIAPIPELINE_SEMVER_VERSION -notmatch '^\d+\.\d+\.\d+\+\d+$') { throw 'Unsafe version value.' }
          if ($env:MEDIAPIPELINE_RELEASE_TAG -cne "app-v$($env:MEDIAPIPELINE_SEMVER_VERSION)") { throw 'Release tag must equal app-v<version> exactly.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Checkout does not match GITHUB_SHA.' }

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Provision CI Python runtime
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiPythonRuntime.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install Tauri dependencies without signing secrets
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm ci

      - name: Full release self-test without signing secrets
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-release-validation'
          .\ops\scripts\release\build.ps1 -DestinationRoot $validationRoot -Force -Verify -IncludeTests

      - name: Stage sanitized installer resources
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-tauri-resources'
          .\ops\scripts\release\build.ps1 -DestinationRoot $resourceRoot -Force

      - name: Python productization contract tests without signing secrets
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          .\apps\desktop\runtime\Python\python.exe -m pytest tests\python\desktop\test_productization_support.py tests\python\desktop\test_api_command_contracts.py tests\python\desktop\test_api_contract_payload.py

      - name: Tauri shell check without signing secrets
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm run check

      - name: Create SHA-256-bound nonsecret validation handoff
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-tauri-resources'
          $handoffRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-validation-handoff'
          New-Item -ItemType Directory -Path $handoffRoot | Out-Null
          $archive = Join-Path $handoffRoot 'sanitized-resources.zip'
          tar.exe -a -c -f $archive -C $resourceRoot .
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive sanitized validation resources.' }
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            schema_version = 'private_beta_validation_handoff.v1'
            source_commit = $env:GITHUB_SHA.ToLowerInvariant()
            archive_name = 'sanitized-resources.zip'
            archive_sha256 = $digest
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $handoffRoot 'handoff.json') -Encoding UTF8

      - name: Upload nonsecret validation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mediapipeline-validation-${{ github.sha }}
          path: ${{ runner.temp }}/mediapipeline-validation-handoff/
          if-no-files-found: error
          retention-days: 2

  sign-windows:
    name: Build signed NSIS installer
    needs: validate-windows
    runs-on: windows-latest
    environment: ${{ inputs.channel }}-release
    permissions:
      actions: read
      contents: write
    env:
      MEDIAPIPELINE_RELEASE_CHANNEL: ${{ inputs.channel }}
      MEDIAPIPELINE_RELEASE_REPOSITORY: ${{ github.repository }}
      MEDIAPIPELINE_RELEASE_TAG: ${{ inputs.release_tag }}
      MEDIAPIPELINE_SEMVER_VERSION: ${{ inputs.version }}
      MEDIAPIPELINE_REBUILD_REQUESTED: ${{ inputs.allow_same_commit_rebuild }}
      MEDIAPIPELINE_REBUILD_APPROVED: ${{ vars.MEDIAPIPELINE_ALLOW_SAME_COMMIT_REBUILD }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Validate protected workflow inputs
        shell: pwsh
        run: |
          if ($env:MEDIAPIPELINE_RELEASE_TAG -cne "app-v$($env:MEDIAPIPELINE_SEMVER_VERSION)") { throw 'Release tag must equal app-v<version> exactly.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Checkout does not match GITHUB_SHA.' }
          if ($env:MEDIAPIPELINE_REBUILD_REQUESTED -eq 'true' -and $env:MEDIAPIPELINE_REBUILD_APPROVED -ne 'true') { throw 'Same-commit rebuild requires protected environment approval.' }

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Provision CI Python runtime
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiPythonRuntime.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install Tauri dependencies without signing secrets
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm ci

      - name: Download nonsecret validation handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mediapipeline-validation-${{ github.sha }}
          path: ${{ runner.temp }}/mediapipeline-validation-handoff

      - name: Verify validation handoff before secret access
        shell: pwsh
        run: |
          $handoffRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-validation-handoff'
          $manifestPath = Join-Path $handoffRoot 'handoff.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 'private_beta_validation_handoff.v1') { throw 'Unexpected validation handoff schema.' }
          if ($manifest.source_commit -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Validation handoff source commit mismatch.' }
          if ($manifest.archive_name -ne 'sanitized-resources.zip') { throw 'Unexpected validation handoff archive name.' }
          $archive = Join-Path $handoffRoot $manifest.archive_name
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.archive_sha256) { throw 'Validation handoff SHA-256 mismatch.' }
          $resourceRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-tauri-resources'
          if (Test-Path -LiteralPath $resourceRoot) { throw 'Validation resource destination must be fresh.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $resourceRoot
          if (-not (Test-Path -LiteralPath (Join-Path $resourceRoot 'release_manifest.json') -PathType Leaf)) { throw 'Validated resource manifest is missing.' }

      - name: Private beta release preflight without private signing credentials
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $resourceRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-tauri-resources'
          .\ops\scripts\release\Test-PrivateBetaReleasePreflight.ps1 `
            -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
            -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
            -Version $env:MEDIAPIPELINE_SEMVER_VERSION `
            -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG `
            -ResourceRoot $resourceRoot `
            -ConfigOutputPath "$env:RUNNER_TEMP\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).preflight.conf.json" `
            -SkipSecretPresence

      - name: Build signed NSIS updater bundle with step-scoped credentials
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-signing-certificate'
          $thumbprint = $null
          try {
            New-Item -ItemType Directory -Path $certificateRoot | Out-Null
            $encodedPath = Join-Path $certificateRoot 'certificate.base64.txt'
            $pfxPath = Join-Path $certificateRoot 'certificate.pfx'
            Set-Content -LiteralPath $encodedPath -Value $env:WINDOWS_CERTIFICATE_BASE64 -Encoding ascii
            certutil -decode $encodedPath $pfxPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Certificate decode failed.' }
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $thumbprint = [string]$cert.Thumbprint
            if (-not $thumbprint) { throw 'Certificate import did not return a thumbprint.' }
            $env:WINDOWS_CERTIFICATE_THUMBPRINT = $thumbprint
            $resourceRoot = Join-Path $env:RUNNER_TEMP 'mediapipeline-tauri-resources'
            .\ops\scripts\release\New-TauriProductizationConfig.ps1 `
              -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
              -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
              -Version $env:MEDIAPIPELINE_SEMVER_VERSION `
              -ResourceRoot $resourceRoot `
              -OutputPath "apps\desktop\tauri\src-tauri\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).generated.conf.json"
            Push-Location apps\desktop\tauri
            try {
              npm run tauri -- build --config "src-tauri\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).generated.conf.json"
              if ($LASTEXITCODE -ne 0) { throw 'Tauri signed build failed.' }
            } finally {
              Pop-Location
            }
          } finally {
            if ($thumbprint) {
              $certificateStorePath = "Cert:\CurrentUser\My\$thumbprint"
              Remove-Item -LiteralPath $certificateStorePath -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $certificateStorePath) { throw 'Imported signing certificate cleanup failed.' }
            }
            if (Test-Path -LiteralPath $certificateRoot) { Remove-Item -LiteralPath $certificateRoot -Recurse -Force }
            if (Test-Path -LiteralPath $certificateRoot) { throw 'Signing certificate file cleanup failed.' }
          }

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps\desktop\tauri\src-tauri\target\release\bundle\nsis -Filter '*.exe' -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)" }

      - name: Generate updater channel JSON and checksums
        shell: pwsh
        run: |
          $notes = "MediaPipelineRemuxEncodeAIO $($env:MEDIAPIPELINE_RELEASE_CHANNEL) build $($env:MEDIAPIPELINE_SEMVER_VERSION)"
          .\ops\scripts\release\New-TauriUpdaterChannelJson.ps1 -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG -Version $env:MEDIAPIPELINE_SEMVER_VERSION -Notes $notes -OutputPath "apps\desktop\tauri\src-tauri\target\release\bundle\latest-$($env:MEDIAPIPELINE_RELEASE_CHANNEL).json"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          .\ops\scripts\release\Test-PrivateBetaReleaseArtifact.ps1 -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG -Version $env:MEDIAPIPELINE_SEMVER_VERSION

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mediapipeline-${{ inputs.channel }}-windows-x64
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/tauri/src-tauri/target/release/bundle/latest-${{ inputs.channel }}.json
            apps/desktop/tauri/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rebuildRequested = $env:MEDIAPIPELINE_REBUILD_REQUESTED -eq 'true'
          .\ops\scripts\release\Publish-PrivateBetaGitHubRelease.ps1 -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG -Version $env:MEDIAPIPELINE_SEMVER_VERSION -SourceCommit $env:GITHUB_SHA -AllowSameCommitRebuild:$rebuildRequested -ProtectedRebuildApproval $env:MEDIAPIPELINE_REBUILD_APPROVED

      - name: Advance and verify updater channel pointer
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\ops\scripts\release\Publish-TauriUpdaterChannelPointer.ps1 -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL -ChannelJsonPath "apps\desktop\tauri\src-tauri\target\release\bundle\latest-$($env:MEDIAPIPELINE_RELEASE_CHANNEL).json" -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG -Version $env:MEDIAPIPELINE_SEMVER_VERSION -SourceCommit $env:GITHUB_SHA
