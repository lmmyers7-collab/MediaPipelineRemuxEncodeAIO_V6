name: Private Beta Windows Installer

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Updater channel to publish"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
      version:
        description: "SemVer package version for Tauri/Cargo/npm/Python metadata"
        required: true
        default: "2026.6.4+001"
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "app-v2026.6.4+001"
      publish_release:
        description: "Create/upload GitHub Release assets"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    name: Build signed NSIS installer
    runs-on: windows-latest
    environment: ${{ inputs.channel }}-release
    env:
      MEDIAPIPELINE_RELEASE_CHANNEL: ${{ inputs.channel }}
      MEDIAPIPELINE_RELEASE_REPOSITORY: ${{ github.repository }}
      MEDIAPIPELINE_RELEASE_TAG: ${{ inputs.release_tag }}
      MEDIAPIPELINE_SEMVER_VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow inputs
        shell: pwsh
        run: |
          $channel = $env:MEDIAPIPELINE_RELEASE_CHANNEL
          $repository = $env:MEDIAPIPELINE_RELEASE_REPOSITORY
          $version = $env:MEDIAPIPELINE_SEMVER_VERSION
          $releaseTag = $env:MEDIAPIPELINE_RELEASE_TAG
          if ($channel -notin @('beta', 'stable')) {
            throw "Unsupported release channel: $channel"
          }
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Unsafe repository value: $repository"
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$') {
            throw "Unsafe version value: $version"
          }
          if ($releaseTag -notmatch '^[A-Za-z0-9][A-Za-z0-9._/+~-]{0,127}$' -or $releaseTag.Contains('..')) {
            throw "Unsafe release tag value: $releaseTag"
          }

      - name: Private beta release preflight
        shell: pwsh
        run: |
          .\ops\scripts\release\Test-PrivateBetaReleasePreflight.ps1 `
            -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
            -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
            -Version $env:MEDIAPIPELINE_SEMVER_VERSION `
            -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG `
            -ConfigOutputPath "$env:RUNNER_TEMP\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).preflight.conf.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Provision CI Python runtime
        shell: pwsh
        run: .\ops\scripts\release\Initialize-CiPythonRuntime.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -LiteralPath certificate\certificate.base64.txt -Value $env:WINDOWS_CERTIFICATE_BASE64 -Encoding ascii
          certutil -decode certificate\certificate.base64.txt certificate\certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert.Thumbprint) { throw 'Certificate import did not return a thumbprint.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tauri dependencies
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm ci

      - name: Generate updater-enabled Tauri config
        shell: pwsh
        run: |
          .\ops\scripts\release\New-TauriProductizationConfig.ps1 `
            -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
            -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
            -Version $env:MEDIAPIPELINE_SEMVER_VERSION `
            -OutputPath "apps\desktop\tauri\src-tauri\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).generated.conf.json"

      - name: Release package dry run
        shell: pwsh
        run: .\ops\scripts\release\build.ps1 -DryRun -Zip

      - name: Python productization contract tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\apps\desktop\runtime\Python\python.exe -m pytest `
            tests\python\desktop\test_productization_support.py `
            tests\python\desktop\test_api_command_contracts.py `
            tests\python\desktop\test_api_contract_payload.py

      - name: Tauri shell check
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm run check

      - name: Build signed NSIS updater bundle
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm run tauri -- build --config "src-tauri\tauri.$($env:MEDIAPIPELINE_RELEASE_CHANNEL).generated.conf.json"

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps\desktop\tauri\src-tauri\target\release\bundle\nsis -Filter '*.exe' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Generate updater channel JSON and checksums
        shell: pwsh
        run: |
          $notes = "MediaPipelineRemuxEncodeAIO $($env:MEDIAPIPELINE_RELEASE_CHANNEL) build $($env:MEDIAPIPELINE_SEMVER_VERSION)"
          .\ops\scripts\release\New-TauriUpdaterChannelJson.ps1 `
            -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
            -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' `
            -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
            -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG `
            -Version $env:MEDIAPIPELINE_SEMVER_VERSION `
            -Notes $notes `
            -OutputPath "apps\desktop\tauri\src-tauri\target\release\bundle\latest-$($env:MEDIAPIPELINE_RELEASE_CHANNEL).json"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          .\ops\scripts\release\Test-PrivateBetaReleaseArtifact.ps1 `
            -Channel $env:MEDIAPIPELINE_RELEASE_CHANNEL `
            -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' `
            -Repository $env:MEDIAPIPELINE_RELEASE_REPOSITORY `
            -ReleaseTag $env:MEDIAPIPELINE_RELEASE_TAG `
            -Version $env:MEDIAPIPELINE_SEMVER_VERSION

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapipeline-${{ inputs.channel }}-windows-x64
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/tauri/src-tauri/target/release/bundle/latest-${{ inputs.channel }}.json
            apps/desktop/tauri/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:MEDIAPIPELINE_RELEASE_TAG
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $title = "MediaPipelineRemuxEncodeAIO $($env:MEDIAPIPELINE_SEMVER_VERSION) ($($env:MEDIAPIPELINE_RELEASE_CHANNEL))"
            $notes = "Signed NSIS $($env:MEDIAPIPELINE_RELEASE_CHANNEL) release. Assets include updater channel JSON and SHA-256 checksums."
            $createArgs = @(
              'release',
              'create',
              $tag,
              '--title',
              $title,
              '--notes',
              $notes,
              '--target',
              $env:GITHUB_SHA
            )
            if ($env:MEDIAPIPELINE_RELEASE_CHANNEL -ne 'stable') {
              $createArgs += '--prerelease'
            }
            gh @createArgs
          }
          gh release upload $tag `
            apps\desktop\tauri\src-tauri\target\release\bundle\nsis\*.exe `
            apps\desktop\tauri\src-tauri\target\release\bundle\nsis\*.sig `
            apps\desktop\tauri\src-tauri\target\release\bundle\latest-$($env:MEDIAPIPELINE_RELEASE_CHANNEL).json `
            apps\desktop\tauri\src-tauri\target\release\bundle\SHA256SUMS.txt `
            --clobber
