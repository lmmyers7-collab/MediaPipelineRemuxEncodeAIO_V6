name: Private Beta Windows Installer

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Updater channel to publish"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
      version:
        description: "SemVer package version for Tauri/Cargo/npm/Python metadata"
        required: true
        default: "2026.6.4+001"
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "app-v2026.6.4+001"
      publish_release:
        description: "Create/upload GitHub Release assets"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build signed NSIS installer
    runs-on: windows-latest
    environment: ${{ inputs.channel }}-release
    env:
      MEDIAPIPELINE_RELEASE_CHANNEL: ${{ inputs.channel }}
      MEDIAPIPELINE_SEMVER_VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private beta release preflight
        shell: pwsh
        run: |
          .\ops\scripts\release\Test-PrivateBetaReleasePreflight.ps1 `
            -Channel '${{ inputs.channel }}' `
            -Repository '${{ github.repository }}' `
            -Version '${{ inputs.version }}' `
            -ReleaseTag '${{ inputs.release_tag }}' `
            -ConfigOutputPath "$env:RUNNER_TEMP\tauri.${{ inputs.channel }}.preflight.conf.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -LiteralPath certificate\certificate.base64.txt -Value $env:WINDOWS_CERTIFICATE_BASE64 -Encoding ascii
          certutil -decode certificate\certificate.base64.txt certificate\certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert.Thumbprint) { throw 'Certificate import did not return a thumbprint.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tauri dependencies
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm ci

      - name: Generate updater-enabled Tauri config
        shell: pwsh
        run: |
          .\ops\scripts\release\New-TauriProductizationConfig.ps1 `
            -Channel '${{ inputs.channel }}' `
            -Repository '${{ github.repository }}' `
            -Version '${{ inputs.version }}' `
            -OutputPath "apps\desktop\tauri\src-tauri\tauri.${{ inputs.channel }}.generated.conf.json"

      - name: Release package dry run
        shell: pwsh
        run: .\ops\scripts\release\build.ps1 -DryRun -Zip

      - name: Python productization contract tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\apps\desktop\runtime\Python\python.exe -m pytest `
            tests\python\desktop\test_productization_support.py `
            tests\python\desktop\test_api_command_contracts.py `
            tests\python\desktop\test_api_contract_payload.py

      - name: Tauri shell check
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm run check

      - name: Build signed NSIS updater bundle
        working-directory: apps/desktop/tauri
        shell: pwsh
        run: npm run tauri -- build --config "src-tauri\tauri.${{ inputs.channel }}.generated.conf.json"

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps\desktop\tauri\src-tauri\target\release\bundle\nsis -Filter '*.exe' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Generate updater channel JSON and checksums
        shell: pwsh
        run: |
          .\ops\scripts\release\New-TauriUpdaterChannelJson.ps1 `
            -Channel '${{ inputs.channel }}' `
            -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' `
            -Repository '${{ github.repository }}' `
            -ReleaseTag '${{ inputs.release_tag }}' `
            -Version '${{ inputs.version }}' `
            -Notes "MediaPipelineRemuxEncodeAIO ${{ inputs.channel }} build ${{ inputs.version }}" `
            -OutputPath "apps\desktop\tauri\src-tauri\target\release\bundle\latest-${{ inputs.channel }}.json"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          .\ops\scripts\release\Test-PrivateBetaReleaseArtifact.ps1 `
            -Channel '${{ inputs.channel }}' `
            -BundleRoot 'apps\desktop\tauri\src-tauri\target\release\bundle' `
            -Repository '${{ github.repository }}' `
            -ReleaseTag '${{ inputs.release_tag }}' `
            -Version '${{ inputs.version }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapipeline-${{ inputs.channel }}-windows-x64
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/tauri/src-tauri/target/release/bundle/latest-${{ inputs.channel }}.json
            apps/desktop/tauri/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @(
              'release',
              'create',
              $tag,
              '--title',
              'MediaPipelineRemuxEncodeAIO ${{ inputs.version }} (${{ inputs.channel }})',
              '--notes',
              'Signed NSIS ${{ inputs.channel }} release. Assets include updater channel JSON and SHA-256 checksums.',
              '--target',
              $env:GITHUB_SHA
            )
            if ('${{ inputs.channel }}' -ne 'stable') {
              $createArgs += '--prerelease'
            }
            gh @createArgs
          }
          gh release upload $tag `
            apps\desktop\tauri\src-tauri\target\release\bundle\nsis\*.exe `
            apps\desktop\tauri\src-tauri\target\release\bundle\nsis\*.sig `
            apps\desktop\tauri\src-tauri\target\release\bundle\latest-${{ inputs.channel }}.json `
            apps\desktop\tauri\src-tauri\target\release\bundle\SHA256SUMS.txt `
            --clobber
