name: Private beta support
description: Report install, update, startup, migration, or diagnostics issues from a private beta build.
title: "[beta-support]: "
labels:
  - beta
  - support
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Use the version shown in Maintenance or the release tag.
      placeholder: "2026.6.4+001"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      options:
        - beta
        - stable
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 x64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fresh install
        - Upgrade
        - Update check
        - Update apply
        - Startup
        - AppData migration
        - Diagnostics export
        - Uninstall or reinstall
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: close_readiness
    attributes:
      label: Close-readiness state
      description: Include the Maintenance productization or close-readiness summary if available. Do not paste tokens or private paths.
  - type: textarea
    id: support_export
    attributes:
      label: Redacted support export
      description: Attach the AppData diagnostics export JSON generated by support export. Confirm it is redacted before attaching.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not attach bearer tokens, signing secrets, private keys, full private config, or unredacted personal paths.
          required: true
        - label: I did not manually move, delete, or overwrite source media while investigating this issue.
          required: true
